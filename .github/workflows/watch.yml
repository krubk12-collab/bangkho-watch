name: watch
on:
  schedule:
    - cron: "*/10 * * * *"     # GitHub อาจเลื่อนช้าไปบ้างช่วงคนใช้เยอะ
  workflow_dispatch:
concurrency:
  group: watch
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: load previous state
        run: |
          mkdir -p site
          if git fetch --depth=1 origin status 2>/dev/null; then
            git show FETCH_HEAD:state.json > site/state.json 2>/dev/null || rm -f site/state.json
            git show FETCH_HEAD:water.json > site/water.json 2>/dev/null || rm -f site/water.json
            for f in gauge.json gauge-pakkret.json outlook.json rid.json wn.json radar.json score.json; do git show FETCH_HEAD:$f > site/$f 2>/dev/null || rm -f site/$f; done
          fi
      - name: check
        env:
          DA_USER: ${{ secrets.DA_USER }}
          DA_PASS: ${{ secrets.DA_PASS }}
          LINE_NOTIFY_URL: ${{ secrets.LINE_NOTIFY_URL }}
          LINE_NOTIFY_KEY: ${{ secrets.LINE_NOTIFY_KEY }}
          OUT_DIR: site
        run: python watch.py
      - name: water alert (Telegram)
        continue-on-error: true      # เตือนน้ำพลาดต้องไม่ทำให้หน้าสถานะเว็บหยุด
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          OUT_DIR: site
          NODE_OPTIONS: --dns-result-order=ipv4first
        run: node water_alert.mjs
      - name: staff gauge Nonthaburi pier (AI)
        continue-on-error: true
        timeout-minutes: 3
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CAM_KEY: ${{ secrets.CAM_KEY }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          OUT_DIR: site
        run: |
          command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null)
          node gauge.mjs
      - name: RID daily report (C.29B, every 2h)
        continue-on-error: true
        timeout-minutes: 3
        env:
          OUT_DIR: site
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: |
          command -v pdftotext >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils >/dev/null)
          node rid.mjs
      - name: radar rain at school (ground truth for score)
        continue-on-error: true
        timeout-minutes: 3
        env:
          OUT_DIR: site
        run: node rain.mjs
      - name: WeatherNext heavy-rain odds (every 3h)
        continue-on-error: true
        timeout-minutes: 3
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          OUT_DIR: site
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
          NODE_OPTIONS: --dns-result-order=ipv4first
        run: node wn.mjs
      - name: forecast log → branch fclog (append-only)
        # เก็บพยากรณ์ Open-Meteo + WeatherNext + ฝนวัดจริง ไว้ตรวจย้อนหลังว่าแหล่งไหนแม่น
        # push แบบไม่ force: ถ้าดึงประวัติเดิมไม่ได้ GitHub จะปฏิเสธ → ข้อมูลเก่าไม่หาย
        continue-on-error: true
        timeout-minutes: 2
        run: |
          [ -s site/fclog-line.json ] || exit 0
          U="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"
          git clone -q --depth=1 -b fclog "$U" fclog 2>/dev/null || { mkdir -p fclog && git -C fclog init -q -b fclog; }
          cat site/fclog-line.json >> "fclog/$(TZ=Asia/Bangkok date +%Y-%m).jsonl"
          rm -f site/fclog-line.json
          node score.mjs fclog fclog/score.json && cp fclog/score.json site/score.json || true
          cd fclog && git add -A
          git -c user.name=bangkho-watch -c user.email=actions@users.noreply.github.com commit -qm "fclog $(TZ=Asia/Bangkok date '+%F %H:%M')"
          git push -q "$U" fclog
      - name: 7-day outlook (AI, every 3h)
        continue-on-error: true
        timeout-minutes: 5
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OUT_DIR: site
          NODE_OPTIONS: --dns-result-order=ipv4first
        run: node outlook.mjs
      - name: publish status page
        run: |
          cp page/index.html site/index.html
          touch site/.nojekyll
          cd site
          git init -q -b status
          git add -A
          git -c user.name=bangkho-watch -c user.email=actions@users.noreply.github.com commit -qm "status"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" status
