name: watch
on:
  schedule:
    - cron: "*/10 * * * *"     # GitHub อาจเลื่อนช้าไปบ้างช่วงคนใช้เยอะ
  workflow_dispatch:
concurrency:
  group: watch
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: load previous state
        run: |
          mkdir -p site
          if git fetch --depth=1 origin status 2>/dev/null; then
            git show FETCH_HEAD:state.json > site/state.json 2>/dev/null || rm -f site/state.json
            git show FETCH_HEAD:water.json > site/water.json 2>/dev/null || rm -f site/water.json
            git show FETCH_HEAD:gauge.json > site/gauge.json 2>/dev/null || rm -f site/gauge.json
          fi
      - name: check
        env:
          DA_USER: ${{ secrets.DA_USER }}
          DA_PASS: ${{ secrets.DA_PASS }}
          LINE_NOTIFY_URL: ${{ secrets.LINE_NOTIFY_URL }}
          LINE_NOTIFY_KEY: ${{ secrets.LINE_NOTIFY_KEY }}
          OUT_DIR: site
        run: python watch.py
      - name: water alert (Telegram)
        continue-on-error: true      # เตือนน้ำพลาดต้องไม่ทำให้หน้าสถานะเว็บหยุด
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          OUT_DIR: site
        run: node water_alert.mjs
      - name: staff gauge Nonthaburi pier (AI)
        continue-on-error: true
        timeout-minutes: 3
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CAM_KEY: ${{ secrets.CAM_KEY }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          OUT_DIR: site
        run: |
          command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null)
          node gauge.mjs
      - name: publish status page
        run: |
          cp page/index.html site/index.html
          touch site/.nojekyll
          cd site
          git init -q -b status
          git add -A
          git -c user.name=bangkho-watch -c user.email=actions@users.noreply.github.com commit -qm "status"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" status
