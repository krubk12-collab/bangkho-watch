name: watch
on:
  schedule:
    - cron: "*/10 * * * *"     # GitHub อาจเลื่อนช้าไปบ้างช่วงคนใช้เยอะ
  workflow_dispatch:
concurrency:
  group: watch
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      AI_HUB_TOKEN: ${{ secrets.AI_HUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      # govhit.mjs นับการดึงข้อมูลภาครัฐของทุกสคริปต์ node → ai-hub /hit (ดู /apihub) — ตั้งหลัง checkout เพราะก่อนหน้านั้นยังไม่มีไฟล์
      - run: echo "NODE_OPTIONS=--import $PWD/govhit.mjs" >> "$GITHUB_ENV"
      - name: load previous state
        run: |
          mkdir -p site
          if git fetch --depth=1 origin status 2>/dev/null; then
            git show FETCH_HEAD:state.json > site/state.json 2>/dev/null || rm -f site/state.json
            git show FETCH_HEAD:water.json > site/water.json 2>/dev/null || rm -f site/water.json
            for f in gauge.json gauge-pakkret.json gauge-pathum.json outlook.json rid.json wn.json radar.json satci.json score.json risk3w.json goto_ai.json wapi.json; do git show FETCH_HEAD:$f > site/$f 2>/dev/null || rm -f site/$f; done
            git archive FETCH_HEAD w 2>/dev/null | tar -x -C site 2>/dev/null || true   # สำเนา PHP อื่นรอบก่อน (ต้นทางพังรอบนี้ยังมีของเดิม)
          fi
      - name: check
        env:
          DA_USER: ${{ secrets.DA_USER }}
          DA_PASS: ${{ secrets.DA_PASS }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          LINE_NOTIFY_URL: ${{ secrets.LINE_NOTIFY_URL }}   # เฉพาะ PHP ล่ม/กลับมา
          LINE_NOTIFY_KEY: ${{ secrets.LINE_NOTIFY_KEY }}
          OUT_DIR: site
        run: python watch.py
      - name: water api mirror (/water/api.php → wapi.json, ใช้แทนตอน PHP โฮสต์ล่ม)
        # สำเนา api.php+dwr.php ใน water-php/ — แก้ ../water/api.php แล้วต้อง cp มาที่นี่ด้วย
        continue-on-error: true
        timeout-minutes: 3
        run: |
          mkdir -p water-php/data
          [ -s site/wapi.json ] && cp site/wapi.json water-php/data/cache.json   # กราฟรอบก่อน (PREV) ตอน สสน. กราฟล่ม
          php -d date.timezone=Asia/Bangkok -d memory_limit=1G -r '$_GET["force"]=1; require "water-php/api.php";' > /tmp/w.json
          php -r 'exit(isset(json_decode(file_get_contents("/tmp/w.json"), true)["stations"]) ? 0 : 1);' && mv /tmp/w.json site/wapi.json
      - name: water php mirror (news/air/gistda/cams → w/, ใช้แทนตอน PHP โฮสต์ล่ม)
        # สำเนาใน water-php/ — แก้ ../water/{news,air,gistda,cams}.php แล้วต้อง cp มาที่นี่ด้วย · dwr ใช้ wapi.json .dwr แทน
        continue-on-error: true
        timeout-minutes: 4
        run: |
          mkdir -p site/w water-php/data
          ok() { php -r 'exit(isset(json_decode(file_get_contents($argv[1]), true)[$argv[2]]) ? 0 : 1);' "$1" "$2"; }
          php -r 'require "water-php/news.php";' > /tmp/n.json; ok /tmp/n.json items && mv /tmp/n.json site/w/news.json
          php -r 'require "water-php/air.php";' > /tmp/a.json; ok /tmp/a.json st && mv /tmp/a.json site/w/air.json
          if [ "$(date +%M)" -lt 10 ] || [ ! -s site/w/gistda.json ]; then   # GISTDA ชั่วโมงละครั้ง (เท่าแคชบนโฮสต์)
            php -r 'require "water-php/gistda.php";' > /tmp/g.json; ok /tmp/g.json updated && mv /tmp/g.json site/w/gistda.json
            [ -s water-php/data/gistda_cells.json ] && cp water-php/data/gistda_cells.json site/w/gistda_cells.json
          fi
          for id in pt1 pt2 pom pridi pyf rsit nA1 nA6 nA7 nA8 nA10 kbb kbk lbl; do
            ( php -r '$_GET["id"]=$argv[1]; require "water-php/cams.php";' "$id" > /tmp/c_$id.jpg
              [ "$(stat -c%s /tmp/c_$id.jpg)" -gt 3000 ] && mv /tmp/c_$id.jpg site/w/cam_$id.jpg ) &
          done; wait
          ls -la site/w
      - name: radio playlist mirror (/keep เพลย์ลิสต์อัตโนมัติ → w/radio.json, ฟังได้ตอน PHP โฮสต์ล่ม)
        continue-on-error: true
        timeout-minutes: 1
        run: |
          K=https://bangkho.ac.th/keep/api.php
          curl -sf --max-time 20 "$K?action=list" -o /tmp/kl.json && curl -sf --max-time 20 "$K?action=remoteState" -o /tmp/ks.json             && node radio.mjs /tmp/kl.json /tmp/ks.json site/w/radio.json
      - name: water alert (Telegram)
        continue-on-error: true      # เตือนน้ำพลาดต้องไม่ทำให้หน้าสถานะเว็บหยุด
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          OUT_DIR: site
          NODE_OPTIONS: --dns-result-order=ipv4first --import ${{ github.workspace }}/govhit.mjs
        run: node water_alert.mjs
      - name: staff gauge Nonthaburi pier (AI)
        continue-on-error: true
        timeout-minutes: 4
        env:
          AI_HUB_GAUGE: ${{ secrets.AI_HUB_GAUGE }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_FREE_KEY: ${{ secrets.GEMINI_FREE_KEY }}
          CAM_KEY: ${{ secrets.CAM_KEY }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          OUT_DIR: site
        run: |
          command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null)
          node gauge.mjs
      - name: RID daily report (C.29B, every 2h)
        continue-on-error: true
        timeout-minutes: 3
        env:
          OUT_DIR: site
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: |
          command -v pdftotext >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils >/dev/null)
          node rid.mjs
      - name: radar rain at school (ground truth for score)
        continue-on-error: true
        timeout-minutes: 3
        env:
          OUT_DIR: site
        run: node rain.mjs
      - name: satellite cloud growth near school (Himawari, test log)
        # 🧪 บันทึกเมฆก่อตัวจากดาวเทียมไว้เทียบกับ radar.json ก่อนเอาป้ายทดลองในหน้าเว็บออก
        continue-on-error: true
        timeout-minutes: 3
        env:
          OUT_DIR: site
        run: |
          command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null)
          node sat.mjs
      - name: WeatherNext heavy-rain odds (every 3h)
        continue-on-error: true
        timeout-minutes: 3
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          OUT_DIR: site
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
          NODE_OPTIONS: --dns-result-order=ipv4first --import ${{ github.workspace }}/govhit.mjs
        run: node wn.mjs
      - name: 4-week school flood risk (every 6h)
        continue-on-error: true
        timeout-minutes: 4
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          OUT_DIR: site
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
          NODE_OPTIONS: --dns-result-order=ipv4first --import ${{ github.workspace }}/govhit.mjs
        run: node risk3w.mjs
      - name: forecast log → branch fclog (append-only)
        # เก็บพยากรณ์ Open-Meteo + WeatherNext + ฝนวัดจริง ไว้ตรวจย้อนหลังว่าแหล่งไหนแม่น
        # push แบบไม่ force: ถ้าดึงประวัติเดิมไม่ได้ GitHub จะปฏิเสธ → ข้อมูลเก่าไม่หาย
        continue-on-error: true
        timeout-minutes: 2
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: |
          [ -s site/fclog-line.json ] || exit 0
          U="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"
          git clone -q --depth=1 -b fclog "$U" fclog 2>/dev/null || { mkdir -p fclog && git -C fclog init -q -b fclog; }
          cat site/fclog-line.json >> "fclog/$(TZ=Asia/Bangkok date +%Y-%m).jsonl"
          rm -f site/fclog-line.json
          node score.mjs fclog fclog/score.json && cp fclog/score.json site/score.json || true
          cd fclog && git add -A
          git -c user.name=bangkho-watch -c user.email=actions@users.noreply.github.com commit -qm "fclog $(TZ=Asia/Bangkok date '+%F %H:%M')"
          git push -q "$U" fclog
      - name: 7-day outlook (AI DeepSeek/Groq, every 6h)
        continue-on-error: true
        timeout-minutes: 5
        env:
          AI_HUB_TOKEN: ${{ secrets.AI_HUB_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OUT_DIR: site
          NODE_OPTIONS: --dns-result-order=ipv4first --import ${{ github.workspace }}/govhit.mjs
        run: node outlook.mjs
      - name: publish status page
        run: |
          cp page/index.html site/index.html
          touch site/.nojekyll
          cd site
          git init -q -b status
          git add -A
          git -c user.name=bangkho-watch -c user.email=actions@users.noreply.github.com commit -qm "status"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" status
